<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* CSS */
        /* 전체 선택자 */
        * {color:gray;}
        /* 태그 선택자 */
        h2 {color:blue;}
        /* ID 선택자 */
        #select-id {color:green;}
        /* Class 선택자 */
        .select-class {color:orange;}
        /* h2태그보다 class 선택자가 더 상세한 범위라 보다 높은 우선순위를 가짐 */
        /* 속성 선택자 */
        [href] {color:purple;}
        [target="_blank"] {color:red;}

    </style>

</head>
<body>

    <!-- class="class name"로 class를 지정하여 그룹으로 묶는디.
    id="id name"로 id를 지정하여 고유하게 개별로식별한다 -->
    <h1>h1</h1>
    <h2>h2</h2>
    <h3 id="select-id">h3</h3>
    <h4 class="select-class">h4</h4>
    <h5>h5</h5>

    <p>p 하나</p>
    <p class="select-class">p 둘</p>
    <p>p 셋</p>
    <p>p 넷</p>


    <!-- target blank는 새 창에서 열기 self는 현재 창에서 열기 -->
    <a href="https://www.naver.com" target="_blank">네이버로 이동</a>
    <a href="https://www.google.com" target="_self">구글로 이동</a>
    <h2>h2</h2>
    <h2>h2</h2>
</body>
</html>
