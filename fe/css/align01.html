<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        /*
            가운데 정렬

            1. margin: 0 auto;   (좌우 여백 margin 자동)
                inline 요소 대상 : 작동X, 좌우 margin이 작동하지 않기 때문
                block 요소 대상 : block 요소 자기자신이 가운데 정렬

            2. text-align: center;
                inline 요소 대상 : 작동X
                block 요소 대상 : 내부 컨텐츠 요소가 가운데 정렬, 부모 요소(box)에게 요청

            block 요소 입장 -> 내가 가운데 정렬 되고 싶다 -> 자기자신 margin: 0 auto;
            inline 요소 입장 -> 내가 가운데 정렬 되고 싶다 -> 자기부모 block 요소에 text-align:center;

        */

        .out-box{
            border: 1px solid black;
            width: 400px;
            text-align: center; /* 내부 요소를 가운데 정렬 */        
            margin: 0 auto; /* 블록 요소가 자기 자신을 가운데 정렬 */            
        }
        /* text-align 은 상속이 되므로 블럭요소인 h2태그도 정렬이 된다. */

        .p1 { text-align: center; }
        .span1 { text-align: center;} /* X */

        .inner-box span {
        text-align: center; /* X */
        margin: 0 auto; /* X */
        }

        /* h2 {text-align: center;} */
        .inner-box {
            /* text-align: center; out-box에 상속된 상태 */

            width: 250px; /* 블럭 요소이기 때문에 width로 크기를 설정하면 가운데 정렬이었던 것이 풀림 */
            border: 1px solid red;
            margin: 0 auto;
        }


    </style>
</head>
<body>
    
    <p class="p1">p1p1</p>
    <span class="span1">span1span1</span>


    <div class="out-box">
        <p>p tag outbox</p>
        <span>span tag outbox</span>

        <div class="inner-box">
            <h2>h2 tag inner box</h2>
            <span>span tag inner box</span>
            <br>
            <input type="button" value="버튼">
        </div>

    </div>


</body>
</html>
