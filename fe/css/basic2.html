<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- css 내부 스타일 시트 방식 -->

    <!-- 외부 스타일 시트 방식 -->          
    <!-- 외부 css 파일 연결-->
    <link rel="stylesheet" href="basic.css">
    
    <style>
    
        /* css 작성하는 영역 */
        /* html > head > style */

        h1 {color: red;}
        h3 {color: orange;}
        /* h5 {color: green;} */
        


            
    </style>




    <!-- 주석 적용하는 단축키
    Ctrl + / 
    Ctrl + K, Ctrl + C
    Alt + Shift + A
    -->
</head>
<body>
    <!-- body는 화면에 표시되는 내용을 작성하는 영역 -->
    <!-- 각종 html 태그가 작성되는 영역-->
    
    <h1>CSS Basic</h1>

    <!-- 인라인 스타일 방식은 내부 스타일 시트 방식보다 우선된다 -->
    <!-- 같은 선택지 레벨 + 같은 속성시 적용 순서 기준으로 나중 속성이 적용됨 -->
    <h1 style="color:blue">CSS h1 태그</h1>
    <h1>CSS h1 태그2</h1>
    <h2 style="color:gold">CSS h2 태그</h2>
    <h3>h3 태그</h3>
    <h4>h4 태그</h4>
    <h5>basic2 h5 태그</h5>


</body>
</html>
