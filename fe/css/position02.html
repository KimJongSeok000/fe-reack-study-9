<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            width: 200px;
            height: 200px;
        }

        .red-box {
            background-color: red;

            left: 100px;
            position: relative;
            z-index: 500;
            /* z-index 값이 클 수록 앞에 배치됨. 우선배치 */

        }

        .green-box {
            background-color: green;
            left: 100px;
            top: 50px;
            position: absolute;
            z-index: 1;
        }

        .blue-box {

            background-color: blue;

            position: relative;
            left: 50px;
            top: -30px;
            /* green-box가 absolute로 흐름이 무시되어 green-box가 있어야 할 자리가 기존위치가 됨.*/
        }
    
    </style>
</head>
<body>

    <div class="box red-box"></div>
    <div class="box green-box"></div>
    <div class="box blue-box"></div>

</body>
</html>
