<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    <p>고객명 : <input type="text"></p>
    <p>전화번호 : <input type="text"></p>
    <p>E-mail : <input type="email"></p>
    피자선택 : <select>
        <option disabled selected hidden>피자를 선택하세요</option>
        <option>치즈피자</option>
        <option>페퍼로니피자</option>
        <option>콤비네이션피자</option>
    </select>
    <fieldset>
        <legend>피자 사이즈</legend>
        <label><input type="radio" name="pz-size"> Small</label>
        <p><label><input type="radio" name="pz-size"> Medium</p></label>
        <p><label><input type="radio" name="pz-size"> Large</p></label>
    </fieldset>
    <fieldset>
        <legend>토핑 선택</legend>
        <label><input type="checkbox"> 베이컨</label>
        <p><label><input type="checkbox"> 치즈</label></p>
        <p><label><input type="checkbox"> 양파</label></p>
        <p><label><input type="checkbox"> 버섯</label></p>
    </fieldset>
    <p><label>희망배송시간 : <input type="time"></label></p>
    <p><label>배송시 요청사항 : <textarea></textarea></label></p>
    <p><button type="submit">주문하기</button></p>
    </form>
</body>
</html>
