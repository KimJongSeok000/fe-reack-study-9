<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    
        .container {
        width: 500px;
        margin: 0 auto;
        margin-top: 50px;
        }
        .sbox {
        width: 250px;
        height: 100px;
        display: inline-block;
        }
        .red-box {background-color: red;}
        .green-box {background-color: green;}
        .blue-box {
            width: 500px;
            height: 200px;
            background-color: blue;
        }
        .text {text-align: center;}
    </style>
</head>
<body>
    <div class="container">
        <div class="sbox red-box"></div><div class="sbox green-box"></div>
        <div class="text">글자가운데정렬</div>
        <div class="blue-box"></div>
    </div>
    
</body>
</html>
