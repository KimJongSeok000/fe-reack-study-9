<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .orange {color: orange;}
        /* h3 {color: orange;} */
        /* h4로 했다면 h4 {color: orange;} 추가 입력 혹은 h3, h4 {color: orange;} 로도 가능 */
        #blue1 {color: blue;}
        #blue2 {color: blue;}
        /* span 태그로 지정했다면 span {color: blue;} 혹은 p, span {color: blue;} 로도 가능 */
        /* li:first-child {color: blue;} */
        /* li {color: blue;} */

        /* 단 id나 class를 사용하는게 더 효율적이며 올바른 방법 */

    </style>
</head>
<body>
    <h3 class="orange">제1회 봄빛 수목원 여름꽃 축제</h3>
    <!-- 불필요한 p테그 삭제 -->
    <p class="orange">수련·수국·무궁화·원추리</p>
    <!-- p테그 대신 h4 사용가능 -->
    <p id="blue1">아름다운 여름꽃과 시원한 바다를 ....</p>
    <ul>
        <li id="blue2">일시 : 6월 15일 부터 8월 15일 까지</li>
        <!-- class로 묶어도 되지만 id로 연습함 -->
        <!-- span테그를 써서 지정하는 방법도 있다. -->
        <li>장소 : 봄빛 수목원 일원</li>
    </ul>
</body>
</html>
