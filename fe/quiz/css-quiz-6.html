<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            margin: 0 auto;
            width: 800px;
            /* height: 500px; */
        }

        .box1 {
            display: flex;
        }

        .box2 {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .yellow {
            background-color: yellow;
            width: 50%;
            height: 100px;
            border: 1px solid black;
        }

        .gray {
            background-color: gray;
            width: 50%;
            height: 100px;
            border: 1px solid black;
        }

        .purple {
            background-color: purple;
            height: 100px;
            border: 1px solid black;
        }

        .skyblue {
            background-color: skyblue;
            height: 200px;
            border: 1px solid black;
            width: 25%;
        }

        .orange {
            background-color: orange;
            width: 50%;
            height: 100px;
            border: 1px solid black;
        }

        .green {
            background-color: green;
            width: 50%;
            height: 100px;
            border: 1px solid black;
        }

        .pink {
            background-color: pink;
            width: 50%;
            height: 100px;
            border: 1px solid black;
        }

        .navy {
            background-color: navy;
            height: 100px;
            border: 1px solid black;
        }

        .aqua {
            background-color: aqua;
            height: 100px;
            border: 1px solid black;
        }

        .gold {
            background-color: gold;
            height: 100px; width: 25%;
            border: 1px solid black;
        }

        .salmon {
            background-color: salmon;
            height: 100px; width: 25%;
            border: 1px solid black;
        }

        .brown {
            background-color: brown;
            height: 100px; width: 25%;
            border: 1px solid black;
        }

        .slate {
            background-color: slateblue;
            height: 100px; width: 25%;
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box1">
            <div class="yellow"></div>
            <div class="gray"></div>
        </div>

        <div class="purple"></div>

        <div class="box1">
            <div class="skyblue"></div>
            <div class="box2">
                <div class="navy"></div>
                <div class="aqua"></div>
            </div>
        </div>

        <div class="box1">
            <div class="gold"></div>
            <div class="salmon"></div>
            <div class="brown"></div>
            <div class="slate"></div>
        </div>


    </div>

</body>

</html>
