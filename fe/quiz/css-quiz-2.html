<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        #table-th {color: blue;}

        /* th {color: blue;} */

        .table-td-odd {color: red;}
        
        #table-id #table-th {color: brown;}
        #table-id tr:nth-child(2n) {color:blue}

        /* table tr:nth-child(2n) {color:red} */
        /* table tr:nth-child(even) {color:red} */
        /* tr:nth-of-type(even/2n) {color:red} */
    </style>
</head>

<body>
    <table class="table-quiz">
        <tr id="table-th">
        <!-- id 대신 class로도 함.  -->
            <th>순번</th>
            <th>아이디</th>
            <th>이름</th>
        </tr>
        <!-- <th class="color-blue">순번<th>
            <th class="color-blue">아이디<th>
            <th class="color-blue">이름<th> 으로도 가능한데 선언부 color는 상속이 된다. -->
        <tr class="table-td-odd">
            <td>1</td>
            <td>apple12</td>
            <td>유재석</td>
        </tr>
        <tr>
            <td>2</td>
            <td>orange5</td>
            <td>강호동</td>
        </tr>
        <tr class="table-td-odd">
            <td>3</td>
            <td>freshwater</td>
            <td>신동엽</td>
        </tr>
        <tr>
            <td>4</td>
            <td>takcard</td>
            <td>탁재훈</td>
        </tr>
        <tr class="table-td-odd">
            <td>5</td>
            <td>lognyeon</td>
            <td>장도연</td>
        </tr>
    </table>
    <br>
    <table id="table-id">
        <!-- id 대신 class로도 함.  -->
        <tr id="table-th">
            <th>순번</th>
            <th>아이디</th>
            <th>이름</th>
        </tr>
        <!-- <th class="color-blue">순번<th>
            <th class="color-blue">아이디<th>
            <th class="color-blue">이름<th> 으로도 가능한데 선언부 color는 상속이 된다. -->
        <tr class="table-td-odd">
            <td>1</td>
            <td>apple12</td>
            <td>유재석</td>
        </tr>
        <tr>
            <td>2</td>
            <td>orange5</td>
            <td>강호동</td>
        </tr>
        <tr class="table-td-odd">
            <td>3</td>
            <td>freshwater</td>
            <td>신동엽</td>
        </tr>
        <tr>
            <td>4</td>
            <td>takcard</td>
            <td>탁재훈</td>
        </tr>
        <tr class="table-td-odd">
            <td>5</td>
            <td>lognyeon</td>
            <td>장도연</td>
        </tr>

    </table>

</body>

</html>
