<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        * {
        margin:0;
        padding:0;
        box-sizing: border-box;}

    .text-top {
        background-color: lightgray;
        }
        /* h3 {background-color: lightgray;} */

    .out-box {
    width: 500px;
    height: 300px;
    border: 5px solid black;
    position: relative;
    margin: 50px;
    /* margin-bottom: 0; 바닥 여백 없음, margin도 나중에 추가한 값이 적용 */
    }

        #red-box {
    width: 100px;
    height: 100px;
    background-color: red;
    }

    #green-box {
    width: 100px;
    height: 100px;
    background-color: green;
    position: absolute;
    left: 50px;
    top: 50px;
    }

    #yellow-box {
    width: 100px;
    height: 100px;
    background-color: yellow;
    }

    /* class="box red-box" 식으로 box 클래스와 색상box 클래스를 나누고 .box로 박스 크기 선언하는게 효율적 */
    /* .box {width:100px; heigth: 100px; } */
    /* .red-box {background-color: red;} ... 각 색상에 맞게 입력 */

    /* case 1, case2 각자 독립적으로 위치 잡기 relative */
    /* 각 박스에 독립적으로 클래스 부여후 position: relative 나 fixed; 적용 후 위치 조정 */
    /* fixed 사용시 추가작업시 스크롤이 내려가야하는 경우 문제가 됨 */
    /* case3 내부에 포함하는 구조*/
    /* <div class="container">case1, 2 내용</div> */
    /* container 위치 조정 */
    /* red는 그대로, green, yellow에 position: relative; 적용 후 위치 조정 */
    /* 다만 margin 적용을 안하고 단순 위치 이동시 차후 추가한 작업내용과 겹칠 수 있음 */

    /* case4 */
    /* case3내용에 absolute 적용하는 방법 */
    /* container에 position: relative; 적용해 위치 조정이 가능한 부모로 만든다 */
    /* green에 position: absolute; 적용하고 위치 조정 */

    </style>
</head>
<body>
    <div class="text-top">
        <h3>배경색이 lightgray<br>h3글자</h3>
        <!-- <h3>배경색이 lightgray</h3>
            <h3>h3글자</h3> 
            <br> 아니어도 됨 -->
    </div>

    <div class="out-box"> <!-- 일반적으로 class="container"를 사용 -->
        <div id="red-box">A</div> <!-- <div class="box red-box">A</div> -->
        <div id="green-box">B</div> <!-- <div class="box green-box">A</div> -->
        <div id="yellow-box">C</div> <!-- <div class="box yellow-box">A</div> -->
    </div>

</body>
</html>
